apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webgoat-devsecops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/lukaradenkovic2003/webgoat-helm.git' # Tvoj URL do Helm repo-a
    targetRevision: HEAD
    path: '.' # Putanja do Helm chart-a unutar repo-a
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: webgoat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true