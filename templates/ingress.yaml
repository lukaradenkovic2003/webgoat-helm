apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/conditions.webgoat-route: '[{"field":"path-pattern","pathPattern":"/*"}]'
    alb.ingress.kubernetes.io/custom-http-headers: '[{"header-name": "X-Cloudflare-Secret", "header-value": "{{ .Values.ingress.cloudflareSecret }}"}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/WebGoat/login"
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: {{ .Values.service.port }}